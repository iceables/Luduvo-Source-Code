<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(195, 195, 197, 0.58) 0%, #C3C3C5 100%), #912ADF;
            color: #ffffff;
            font-family: 'Ubuntu', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }
        .livetimer-page {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .curtain {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            background-color: #000000;
            z-index: 8;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }
        .curtain-top {
            top: 0;
        }
        .curtain-bottom {
            bottom: 0;
        }
        .timer-content {
            position: relative;
            z-index: 10;
            color: #ffffff;
            font-size: 7rem;
            font-weight: 700;
            line-height: 1.1em;
            text-align: center;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.25s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .event-video {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 9999;
            pointer-events: none;
        }
        .video-spinner {
            display: none;
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            color: #ffffff;
            animation: vSpin 1s linear infinite;
            z-index: 999;
            pointer-events: none;
        }
        .v-spin-svg {
            width: 100%;
            height: 100%;
        }
        @keyframes vSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 768px) {
            .timer-content {
                font-size: 4.5rem;
            }
        }
        @media (max-width: 480px) {
            .timer-content {
                font-size: 3rem;
            }
        }
        .dgtcnt {
            display: inline-block;
            height: 1.1em;
            line-height: 1.1em;
            overflow: hidden;
            position: relative;
            vertical-align: top;
        }
        .dgtstp {
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        .dgtnum {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 1.1em;
            line-height: 1.1em;
            text-align: center;
            flex-shrink: 0;
        }
        .digit-colon {
            display: inline-block;
            height: 1.1em;
            line-height: 1.1em;
            vertical-align: top;
            margin: 0 0.1em;
        }
        .m-anim-30m {
            animation: slightBounce30m 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .m-anim-15m {
            animation: slightBounce15m 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        .page-transitioning .curtain-top {
            transform: translateY(-100%);
        }
        .page-transitioning .curtain-bottom {
            transform: translateY(100%);
        }
        .page-transitioning .timer-content {
            opacity: 0;
            transform: scale(0.92);
        }
        @keyframes slightBounce30m {
            0% { transform: scale(1); }
            50% { transform: scale(1.06) translateY(-2px); }
            100% { transform: scale(1) translateY(0); }
        }
        @keyframes slightBounce15m {
            0% { transform: scale(1) rotateX(0deg); }
            40% { transform: scale(1.08) rotateX(-10deg) translateY(-3px); }
            100% { transform: scale(1) rotateX(0deg) translateY(0); }
        }
    </style>
</head>
<body>
    <audio id="ambientAudio" loop autoplay></audio>
    <video id="eventVideo" class="event-video" playsinline></video>
    <div id="videoSpinner" class="video-spinner">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" role="status" class="v-spin-svg">
            <defs>
                <linearGradient id="vSpinLeading" x1="50%" x2="50%" y1="5.271%" y2="91.793%">
                    <stop offset="0%" stop-color="currentColor" />
                    <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                </linearGradient>
                <linearGradient id="vSpinTrailing" x1="50%" x2="50%" y1="15.24%" y2="87.15%">
                    <stop offset="0%" stop-color="currentColor" stop-opacity="0" />
                    <stop offset="100%" stop-color="currentColor" stop-opacity="0.55" />
                </linearGradient>
            </defs>
            <g fill="none">
                <path d="M8.749.021a1.5 1.5 0 0 1 .497 2.958A7.5 7.5 0 0 0 3 10.375a7.5 7.5 0 0 0 7.5 7.5v3c-5.799 0-10.5-4.7-10.5-10.5C0 5.23 3.726.865 8.749.021" fill="url(#vSpinLeading)" transform="translate(1.5 1.625)" />
                <path d="M15.392 2.673a1.5 1.5 0 0 1 2.119-.115A10.48 10.48 0 0 1 21 10.375c0 5.8-4.701 10.5-10.5 10.5v-3a7.5 7.5 0 0 0 5.007-13.084a1.5 1.5 0 0 1-.115-2.118" fill="url(#vSpinTrailing)" transform="translate(1.5 1.625)" />
            </g>
        </svg>
    </div>
    <div class="livetimer-page" id="timerPage" data-target-end-ms="{{.TargetEndMs}}" data-total-duration-ms="{{.TotalDurationMs}}" data-should-preload="{{.ShouldPreloadVideo}}">
        <div class="curtain curtain-top"></div>
        <div class="curtain curtain-bottom"></div>
        <div class="timer-content" id="livetimerDisplay"></div>
    </div>
    <script src="/static/js/livetimer/livetimer.js"></script>
</body>
</html>
