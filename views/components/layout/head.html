<script>
    if (/Android|iPhone|iPod/i.test(navigator.userAgent)) {
        document.documentElement.classList.add('mobmode');
    } else if (/iPad|Tablet/i.test(navigator.userAgent)) {
    }

    let isReload = false;
    if (window.performance && window.performance.getEntriesByType) {
        const navEntries = window.performance.getEntriesByType('navigation');
        if (navEntries.length > 0 && navEntries[0].type === 'reload') {
            isReload = true;
        }
    }

    if (isReload) {
        sessionStorage.removeItem('alreadyLoaded');
    }

    if (!isReload && sessionStorage.getItem('alreadyLoaded') === 'true') {
        document.documentElement.classList.add('notreq');
    } else {
        setTimeout(function() {
            document.documentElement.classList.add('notreq');
            sessionStorage.setItem('alreadyLoaded', 'true');
        }, 1500);
    }

    document.addEventListener('htmx:beforeTransition', function() {
        document.documentElement.classList.add('notreq');
        sessionStorage.setItem('alreadyLoaded', 'true');
    });
</script>
